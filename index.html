<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STAR DRIFT — Arcade Shooter</title>
<style>
  :root {
    --neon-cyan: #00f0ff;
    --neon-pink: #ff2bd6;
    --neon-yellow: #ffe600;
    --neon-green: #39ff14;
    --bg: #05030f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(ellipse at center, #0a0530 0%, #05030f 70%, #000 100%);
    color: #fff;
    font-family: "Courier New", monospace;
    overflow: hidden;
    user-select: none;
  }
  #game-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: #000;
    border: 2px solid var(--neon-cyan);
    box-shadow:
      0 0 20px var(--neon-cyan),
      0 0 40px rgba(0, 240, 255, 0.4),
      inset 0 0 30px rgba(0, 240, 255, 0.15);
    image-rendering: pixelated;
    max-width: 100%;
    max-height: 100%;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    text-align: center;
    padding: 20px;
  }
  #overlay.show { pointer-events: auto; }
  .panel {
    background: rgba(5, 3, 15, 0.9);
    border: 2px solid var(--neon-pink);
    box-shadow: 0 0 30px var(--neon-pink), inset 0 0 20px rgba(255, 43, 214, 0.2);
    padding: 30px 40px;
    max-width: 540px;
  }
  h1 {
    font-size: clamp(32px, 6vw, 56px);
    color: var(--neon-cyan);
    text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-pink);
    letter-spacing: 6px;
    margin-bottom: 12px;
    animation: flicker 2.5s infinite;
  }
  h2 {
    font-size: clamp(20px, 4vw, 32px);
    color: var(--neon-yellow);
    text-shadow: 0 0 8px var(--neon-yellow);
    margin-bottom: 16px;
    letter-spacing: 4px;
  }
  p { line-height: 1.7; margin: 8px 0; font-size: 14px; }
  .keys { color: var(--neon-green); font-weight: bold; }
  .hint {
    margin-top: 18px;
    color: var(--neon-cyan);
    font-size: 16px;
    animation: pulse 1.2s infinite;
    letter-spacing: 2px;
  }
  #hud {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 30px;
    font-size: 16px;
    z-index: 5;
    pointer-events: none;
    width: min(900px, 95%);
    justify-content: space-between;
    padding: 0 8px;
  }
  .hud-cell { display: flex; align-items: center; gap: 6px; }
  .label { color: #888; letter-spacing: 1px; font-size: 12px; }
  .value { color: var(--neon-cyan); text-shadow: 0 0 6px var(--neon-cyan); }
  .lives { color: var(--neon-pink); text-shadow: 0 0 6px var(--neon-pink); }
  .wave { color: var(--neon-yellow); text-shadow: 0 0 6px var(--neon-yellow); }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.85; }
    52% { opacity: 1; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.97); }
  }
  .controls-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 24px;
    margin: 14px 0;
    text-align: left;
    font-size: 13px;
  }
  .controls-row div { display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game" width="900" height="700"></canvas>
  <div id="hud">
    <div class="hud-cell"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
    <div class="hud-cell"><span class="label">WAVE</span><span class="wave" id="wave">1</span></div>
    <div class="hud-cell"><span class="label">LIVES</span><span class="lives" id="lives">♥♥♥</span></div>
    <div class="hud-cell"><span class="label">HI-SCORE</span><span class="value" id="hi">0</span></div>
  </div>
  <div id="overlay" class="show">
    <div class="panel" id="start-panel">
      <h1>STAR DRIFT</h1>
      <h2>ARCADE SHOOTER</h2>
      <div class="controls-row">
        <div><span class="keys">← →</span> 또는 <span class="keys">A D</span></div><div>이동</div>
        <div><span class="keys">↑ ↓</span> 또는 <span class="keys">W S</span></div><div>전후진</div>
        <div><span class="keys">SPACE</span></div><div>발사</div>
        <div><span class="keys">SHIFT</span></div><div>부스트</div>
        <div><span class="keys">P</span></div><div>일시정지</div>
        <div><span class="keys">M</span></div><div>음소거</div>
      </div>
      <p>적을 격추하고 파워업을 모아 살아남으세요.</p>
      <p class="hint">▶ SPACE 키로 시작</p>
    </div>
  </div>
</div>

<script>
(() => {
  // ============ Canvas Setup ============
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const waveEl = document.getElementById('wave');
  const hiEl = document.getElementById('hi');
  const overlay = document.getElementById('overlay');
  const startPanel = document.getElementById('start-panel');

  // ============ State ============
  const STATE = { MENU: 0, PLAY: 1, PAUSE: 2, OVER: 3, WAVE: 4 };
  let gameState = STATE.MENU;
  let score = 0, lives = 3, wave = 1, hiScore = +(localStorage.getItem('starDriftHi') || 0);
  let muted = false;
  hiEl.textContent = hiScore;

  // ============ Input ============
  const keys = {};
  let firePressedAt = 0;
  addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
    keys[e.key.toLowerCase()] = true;
    if (e.key === ' ') keys[' '] = true;

    if (gameState === STATE.MENU && e.key === ' ') startGame();
    else if (gameState === STATE.OVER && e.key === ' ') startGame();
    else if (gameState === STATE.PLAY && (e.key === 'p' || e.key === 'P')) pauseGame();
    else if (gameState === STATE.PAUSE && (e.key === 'p' || e.key === 'P')) resumeGame();
    if (e.key === 'm' || e.key === 'M') muted = !muted;
  });
  addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
    if (e.key === ' ') keys[' '] = false;
  });

  // ============ Audio (Web Audio synth) ============
  let audioCtx;
  function getAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(_) { audioCtx = null; }
    }
    return audioCtx;
  }
  function beep(freq, dur, type = 'square', vol = 0.05) {
    if (muted) return;
    const ac = getAudio();
    if (!ac) return;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, ac.currentTime);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + dur);
  }
  function sweep(f1, f2, dur, type = 'sawtooth', vol = 0.06) {
    if (muted) return;
    const ac = getAudio();
    if (!ac) return;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(f2, ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + dur);
  }
  function noise(dur, vol = 0.08) {
    if (muted) return;
    const ac = getAudio();
    if (!ac) return;
    const buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    const src = ac.createBufferSource();
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, ac.currentTime);
    src.buffer = buf;
    src.connect(g); g.connect(ac.destination);
    src.start();
  }

  // ============ Entities ============
  const player = {
    x: W / 2, y: H - 80,
    w: 32, h: 36,
    vx: 0, vy: 0,
    speed: 5,
    cooldown: 0,
    fireRate: 10,
    invuln: 0,
    powerLevel: 1, // 1 = single, 2 = double, 3 = triple
    boost: 1,
    boostFuel: 100,
    rapid: 0,
    shield: 0,
  };

  let bullets = [];
  let enemyBullets = [];
  let enemies = [];
  let particles = [];
  let powerups = [];
  let stars = [];
  let floatingText = [];

  // Initialize starfield
  for (let i = 0; i < 140; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      z: Math.random() * 0.8 + 0.2,
    });
  }

  // ============ Helpers ============
  function rand(a, b) { return a + Math.random() * (b - a); }
  function dist2(a, b) {
    const dx = a.x - b.x, dy = a.y - b.y;
    return dx*dx + dy*dy;
  }
  function rectsCollide(a, b) {
    return a.x - a.w/2 < b.x + b.w/2 &&
           a.x + a.w/2 > b.x - b.w/2 &&
           a.y - a.h/2 < b.y + b.h/2 &&
           a.y + a.h/2 > b.y - b.h/2;
  }

  function spawnParticles(x, y, color, count = 14, speed = 4) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = rand(speed * 0.3, speed);
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: rand(20, 45),
        maxLife: 45,
        color,
        size: rand(1.5, 3.5),
      });
    }
  }

  function addFloatingText(x, y, text, color = '#fff') {
    floatingText.push({ x, y, text, color, life: 50, vy: -1 });
  }

  // ============ Enemy Types ============
  // grunt: weak, moves down, simple shot
  // zigzag: moves in zigzag, faster
  // bomber: tougher, fires aimed shots
  // mini-boss: appears every 5 waves
  function spawnWave(n) {
    enemies = [];
    const isBoss = n % 5 === 0;
    if (isBoss) {
      enemies.push({
        x: W/2, y: -80,
        w: 100, h: 80,
        vx: 1.4, vy: 0.3,
        type: 'boss',
        hp: 25 + n * 2,
        maxHp: 25 + n * 2,
        fireTimer: 80,
        pattern: 0,
        score: 500,
      });
      return;
    }
    const count = Math.min(6 + n * 2, 24);
    for (let i = 0; i < count; i++) {
      const r = Math.random();
      let type, hp, score, w, h, fire;
      if (r < 0.55) { type = 'grunt'; hp = 1; score = 50; w = 28; h = 24; fire = 120; }
      else if (r < 0.85) { type = 'zigzag'; hp = 2; score = 100; w = 30; h = 26; fire = 160; }
      else { type = 'bomber'; hp = 3 + Math.floor(n/2); score = 200; w = 38; h = 32; fire = 100; }

      enemies.push({
        x: rand(60, W - 60),
        y: rand(-400, -40) - i * 30,
        w, h,
        vx: type === 'zigzag' ? rand(1.5, 2.5) * (Math.random() < 0.5 ? -1 : 1) : 0,
        vy: rand(0.8, 1.4) + n * 0.08,
        type, hp, maxHp: hp, score,
        fireTimer: rand(60, fire + n * -5),
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  function maybeSpawnPowerup(x, y) {
    if (Math.random() < 0.12) {
      const types = ['power', 'rapid', 'life', 'shield'];
      const weights = [0.4, 0.35, 0.1, 0.15];
      let r = Math.random(), idx = 0, acc = 0;
      for (let i = 0; i < weights.length; i++) {
        acc += weights[i];
        if (r < acc) { idx = i; break; }
      }
      powerups.push({ x, y, vy: 1.5, w: 18, h: 18, type: types[idx], phase: 0 });
    }
  }

  // ============ Updates ============
  function updatePlayer() {
    let dx = 0, dy = 0;
    if (keys['arrowleft'] || keys['a']) dx -= 1;
    if (keys['arrowright'] || keys['d']) dx += 1;
    if (keys['arrowup'] || keys['w']) dy -= 1;
    if (keys['arrowdown'] || keys['s']) dy += 1;

    const boosting = (keys['shift']) && player.boostFuel > 0;
    if (boosting) {
      player.boost = 1.8;
      player.boostFuel = Math.max(0, player.boostFuel - 1.2);
    } else {
      player.boost = 1;
      player.boostFuel = Math.min(100, player.boostFuel + 0.4);
    }

    if (dx && dy) { dx *= 0.707; dy *= 0.707; }
    player.x += dx * player.speed * player.boost;
    player.y += dy * player.speed * player.boost;
    player.x = Math.max(player.w/2, Math.min(W - player.w/2, player.x));
    player.y = Math.max(H * 0.4, Math.min(H - player.h/2, player.y));

    if (player.cooldown > 0) player.cooldown--;
    if (player.invuln > 0) player.invuln--;
    if (player.rapid > 0) player.rapid--;
    if (player.shield > 0) player.shield--;

    if (keys[' '] && player.cooldown <= 0) {
      shoot();
      player.cooldown = player.rapid > 0 ? 4 : player.fireRate - Math.min(4, wave / 3);
    }
  }

  function shoot() {
    const lvl = player.powerLevel;
    const y = player.y - 20;
    if (lvl >= 1) bullets.push({ x: player.x, y, vy: -10, vx: 0, w: 4, h: 14, color: '#00f0ff' });
    if (lvl >= 2) {
      bullets.push({ x: player.x - 10, y, vy: -10, vx: 0, w: 4, h: 14, color: '#00f0ff' });
      bullets.push({ x: player.x + 10, y, vy: -10, vx: 0, w: 4, h: 14, color: '#00f0ff' });
    }
    if (lvl >= 3) {
      bullets.push({ x: player.x - 16, y: y + 6, vy: -9.5, vx: -1.2, w: 4, h: 12, color: '#ffe600' });
      bullets.push({ x: player.x + 16, y: y + 6, vy: -9.5, vx: 1.2, w: 4, h: 12, color: '#ffe600' });
    }
    beep(900 + Math.random() * 100, 0.06, 'square', 0.03);
  }

  function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx; b.y += b.vy;
      if (b.y < -20 || b.y > H + 20 || b.x < -20 || b.x > W + 20) bullets.splice(i, 1);
    }
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const b = enemyBullets[i];
      b.x += b.vx; b.y += b.vy;
      if (b.y > H + 20 || b.y < -20 || b.x < -20 || b.x > W + 20) enemyBullets.splice(i, 1);
    }
  }

  function updateEnemies() {
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (e.type === 'zigzag') {
        e.x += e.vx;
        if (e.x < 30 || e.x > W - 30) e.vx *= -1;
        e.y += e.vy + Math.sin(e.phase += 0.05) * 0.3;
      } else if (e.type === 'boss') {
        e.x += e.vx;
        if (e.x < 60 || e.x > W - 60) e.vx *= -1;
        if (e.y < 90) e.y += e.vy;
        e.fireTimer--;
        if (e.fireTimer <= 0) {
          const pat = e.pattern % 3;
          if (pat === 0) {
            for (let a = -2; a <= 2; a++) {
              enemyBullets.push({ x: e.x, y: e.y + 30, vx: a * 1.2, vy: 4, w: 6, h: 6, color: '#ff2bd6' });
            }
          } else if (pat === 1) {
            const ang = Math.atan2(player.y - e.y, player.x - e.x);
            for (let k = -1; k <= 1; k++) {
              enemyBullets.push({
                x: e.x, y: e.y + 30,
                vx: Math.cos(ang + k * 0.18) * 5,
                vy: Math.sin(ang + k * 0.18) * 5,
                w: 8, h: 8, color: '#ff2bd6'
              });
            }
          } else {
            for (let a = 0; a < 8; a++) {
              const ang = (a / 8) * Math.PI * 2;
              enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(ang) * 3.5, vy: Math.sin(ang) * 3.5, w: 6, h: 6, color: '#ff2bd6' });
            }
          }
          e.pattern++;
          e.fireTimer = 70;
          beep(180, 0.1, 'sawtooth', 0.04);
        }
      } else {
        e.y += e.vy;
        e.fireTimer--;
        if (e.fireTimer <= 0 && e.y > 0 && e.y < H * 0.7) {
          if (e.type === 'bomber') {
            const ang = Math.atan2(player.y - e.y, player.x - e.x);
            enemyBullets.push({
              x: e.x, y: e.y + 12,
              vx: Math.cos(ang) * 4, vy: Math.sin(ang) * 4,
              w: 6, h: 6, color: '#ff8800'
            });
          } else {
            enemyBullets.push({ x: e.x, y: e.y + 12, vx: 0, vy: 4.5, w: 4, h: 10, color: '#ff2bd6' });
          }
          e.fireTimer = rand(80, 160);
          beep(280, 0.08, 'square', 0.025);
        }
      }
      if (e.y > H + 60) enemies.splice(i, 1);
    }
  }

  function updatePowerups() {
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.y += p.vy;
      p.phase += 0.1;
      if (p.y > H + 20) powerups.splice(i, 1);
      else if (rectsCollide(p, player)) {
        applyPowerup(p.type);
        powerups.splice(i, 1);
      }
    }
  }

  function applyPowerup(type) {
    if (type === 'power') {
      if (player.powerLevel < 3) {
        player.powerLevel++;
        addFloatingText(player.x, player.y - 30, 'POWER UP!', '#ffe600');
      } else {
        score += 200;
        addFloatingText(player.x, player.y - 30, '+200', '#ffe600');
      }
      sweep(400, 1200, 0.25, 'square', 0.06);
    } else if (type === 'rapid') {
      player.rapid = 360;
      addFloatingText(player.x, player.y - 30, 'RAPID FIRE', '#00f0ff');
      sweep(600, 1800, 0.25, 'square', 0.05);
    } else if (type === 'life') {
      lives = Math.min(5, lives + 1);
      addFloatingText(player.x, player.y - 30, '+1 LIFE', '#ff2bd6');
      sweep(300, 900, 0.4, 'sine', 0.08);
    } else if (type === 'shield') {
      player.shield = 360;
      addFloatingText(player.x, player.y - 30, 'SHIELD', '#39ff14');
      sweep(200, 800, 0.3, 'triangle', 0.06);
    }
    updateHUD();
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.96; p.vy *= 0.96;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = floatingText.length - 1; i >= 0; i--) {
      floatingText[i].y += floatingText[i].vy;
      floatingText[i].life--;
      if (floatingText[i].life <= 0) floatingText.splice(i, 1);
    }
  }

  function updateStars() {
    for (const s of stars) {
      s.y += s.z * 2.5;
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    }
  }

  // ============ Collisions ============
  function checkCollisions() {
    // Player bullets vs enemies
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (rectsCollide(b, e)) {
          e.hp--;
          spawnParticles(b.x, b.y, '#00f0ff', 4, 2);
          bullets.splice(i, 1);
          if (e.hp <= 0) {
            score += e.score;
            addFloatingText(e.x, e.y, '+' + e.score, '#ffe600');
            spawnParticles(e.x, e.y, e.type === 'boss' ? '#ff2bd6' : '#ff8800', e.type === 'boss' ? 60 : 22, e.type === 'boss' ? 7 : 5);
            if (e.type !== 'boss') maybeSpawnPowerup(e.x, e.y);
            else {
              // boss drops multiple
              for (let k = 0; k < 3; k++) maybeSpawnPowerup(e.x + rand(-30,30), e.y + rand(-20,20));
              powerups.push({ x: e.x, y: e.y, vy: 1.2, w: 18, h: 18, type: 'life', phase: 0 });
            }
            enemies.splice(j, 1);
            noise(0.18, 0.06);
            updateHUD();
          } else {
            beep(500, 0.04, 'square', 0.02);
          }
          break;
        }
      }
    }

    // Enemy bullets vs player
    if (player.invuln <= 0) {
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i];
        if (rectsCollide(b, player)) {
          enemyBullets.splice(i, 1);
          hitPlayer();
          break;
        }
      }
      // Enemies vs player (collision)
      for (let i = enemies.length - 1; i >= 0; i--) {
        if (rectsCollide(enemies[i], player)) {
          if (enemies[i].type !== 'boss') {
            spawnParticles(enemies[i].x, enemies[i].y, '#ff8800', 22, 5);
            enemies.splice(i, 1);
          }
          hitPlayer();
          break;
        }
      }
    }
  }

  function hitPlayer() {
    if (player.shield > 0) {
      player.shield = 0;
      spawnParticles(player.x, player.y, '#39ff14', 24, 4);
      addFloatingText(player.x, player.y - 30, 'SHIELD!', '#39ff14');
      sweep(800, 200, 0.25, 'triangle', 0.08);
      player.invuln = 30;
      return;
    }
    lives--;
    player.invuln = 90;
    player.powerLevel = Math.max(1, player.powerLevel - 1);
    spawnParticles(player.x, player.y, '#ff2bd6', 40, 6);
    sweep(600, 100, 0.4, 'sawtooth', 0.1);
    updateHUD();
    if (lives <= 0) gameOver();
  }

  // ============ Render ============
  function render() {
    ctx.fillStyle = 'rgba(5, 3, 15, 0.45)';
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (const s of stars) {
      ctx.fillStyle = `rgba(255,255,255,${s.z})`;
      const size = s.z * 2;
      ctx.fillRect(s.x, s.y, size, size);
    }

    // Powerups
    for (const p of powerups) drawPowerup(p);

    // Player bullets
    for (const b of bullets) {
      ctx.fillStyle = b.color;
      ctx.shadowColor = b.color; ctx.shadowBlur = 10;
      ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
      ctx.shadowBlur = 0;
    }

    // Enemy bullets
    for (const b of enemyBullets) {
      ctx.fillStyle = b.color;
      ctx.shadowColor = b.color; ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.w/2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Enemies
    for (const e of enemies) drawEnemy(e);

    // Player
    if (gameState === STATE.PLAY || gameState === STATE.PAUSE || gameState === STATE.WAVE) drawPlayer();

    // Particles
    for (const p of particles) {
      const alpha = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.globalAlpha = alpha;
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
      ctx.globalAlpha = 1;
    }

    // Floating text
    for (const t of floatingText) {
      ctx.fillStyle = t.color;
      ctx.globalAlpha = Math.min(1, t.life / 30);
      ctx.font = 'bold 14px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(t.text, t.x, t.y);
      ctx.globalAlpha = 1;
    }

    // Boost bar
    if (gameState === STATE.PLAY || gameState === STATE.PAUSE) {
      ctx.fillStyle = '#222';
      ctx.fillRect(20, H - 24, 160, 8);
      ctx.fillStyle = player.boostFuel > 30 ? '#00f0ff' : '#ff8800';
      ctx.fillRect(20, H - 24, 160 * (player.boostFuel/100), 8);
      ctx.fillStyle = '#888';
      ctx.font = '10px "Courier New", monospace';
      ctx.textAlign = 'left';
      ctx.fillText('BOOST', 20, H - 30);

      // Status indicators
      let sx = 200;
      if (player.rapid > 0) {
        ctx.fillStyle = '#00f0ff';
        ctx.font = 'bold 12px "Courier New", monospace';
        ctx.fillText('R:' + Math.ceil(player.rapid/60) + 's', sx, H - 16);
        sx += 80;
      }
      if (player.shield > 0) {
        ctx.fillStyle = '#39ff14';
        ctx.font = 'bold 12px "Courier New", monospace';
        ctx.fillText('S:' + Math.ceil(player.shield/60) + 's', sx, H - 16);
      }
    }

    // Boss healthbar
    const boss = enemies.find(e => e.type === 'boss');
    if (boss) {
      const bw = 500;
      ctx.fillStyle = '#222';
      ctx.fillRect(W/2 - bw/2, 50, bw, 12);
      ctx.fillStyle = '#ff2bd6';
      ctx.shadowColor = '#ff2bd6'; ctx.shadowBlur = 8;
      ctx.fillRect(W/2 - bw/2, 50, bw * (boss.hp/boss.maxHp), 12);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#fff';
      ctx.strokeRect(W/2 - bw/2, 50, bw, 12);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('SECTOR BOSS', W/2, 46);
    }
  }

  function drawPlayer() {
    const px = player.x, py = player.y;
    const flicker = player.invuln > 0 && Math.floor(player.invuln/4) % 2 === 0;
    if (flicker) return;

    // Engine flame
    const flame = 8 + Math.sin(performance.now()/40) * 4;
    ctx.fillStyle = '#ff8800';
    ctx.shadowColor = '#ffe600'; ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(px - 6, py + 14);
    ctx.lineTo(px, py + 14 + flame);
    ctx.lineTo(px + 6, py + 14);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Ship body
    ctx.fillStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(px, py - 18);
    ctx.lineTo(px - 16, py + 12);
    ctx.lineTo(px - 6, py + 6);
    ctx.lineTo(px, py + 10);
    ctx.lineTo(px + 6, py + 6);
    ctx.lineTo(px + 16, py + 12);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    // Cockpit
    ctx.fillStyle = '#ffe600';
    ctx.beginPath();
    ctx.arc(px, py - 2, 4, 0, Math.PI * 2);
    ctx.fill();

    // Shield
    if (player.shield > 0) {
      ctx.strokeStyle = '#39ff14';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 14;
      ctx.globalAlpha = 0.6 + Math.sin(performance.now()/100) * 0.3;
      ctx.beginPath();
      ctx.arc(px, py, 26, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }
  }

  function drawEnemy(e) {
    ctx.save();
    ctx.translate(e.x, e.y);

    if (e.type === 'grunt') {
      ctx.fillStyle = '#ff2bd6';
      ctx.shadowColor = '#ff2bd6'; ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(0, 12);
      ctx.lineTo(-14, -8);
      ctx.lineTo(-4, -2);
      ctx.lineTo(0, -8);
      ctx.lineTo(4, -2);
      ctx.lineTo(14, -8);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillRect(-2, -2, 4, 4);
    } else if (e.type === 'zigzag') {
      ctx.fillStyle = '#ff8800';
      ctx.shadowColor = '#ff8800'; ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(0, 13);
      ctx.lineTo(-15, 0);
      ctx.lineTo(-8, -10);
      ctx.lineTo(8, -10);
      ctx.lineTo(15, 0);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffe600';
      ctx.fillRect(-3, -4, 6, 6);
    } else if (e.type === 'bomber') {
      ctx.fillStyle = '#39ff14';
      ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(0, 16);
      ctx.lineTo(-19, 4);
      ctx.lineTo(-14, -12);
      ctx.lineTo(14, -12);
      ctx.lineTo(19, 4);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillRect(-8, -4, 4, 6);
      ctx.fillRect(4, -4, 4, 6);
      // HP indicator
      if (e.hp < e.maxHp) {
        ctx.fillStyle = '#333';
        ctx.fillRect(-15, -20, 30, 3);
        ctx.fillStyle = '#39ff14';
        ctx.fillRect(-15, -20, 30 * (e.hp/e.maxHp), 3);
      }
    } else if (e.type === 'boss') {
      ctx.fillStyle = '#7a00ff';
      ctx.shadowColor = '#ff2bd6'; ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.moveTo(-50, -30);
      ctx.lineTo(50, -30);
      ctx.lineTo(40, 25);
      ctx.lineTo(20, 35);
      ctx.lineTo(-20, 35);
      ctx.lineTo(-40, 25);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ff2bd6';
      ctx.fillRect(-30, -15, 60, 10);
      ctx.fillStyle = '#ffe600';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(-20, 5, 5, 0, Math.PI * 2);
      ctx.arc(20, 5, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, 0, 7, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function drawPowerup(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.phase * 0.4);
    let color = '#ffe600';
    let label = 'P';
    if (p.type === 'rapid') { color = '#00f0ff'; label = 'R'; }
    else if (p.type === 'life') { color = '#ff2bd6'; label = '♥'; }
    else if (p.type === 'shield') { color = '#39ff14'; label = 'S'; }
    ctx.fillStyle = color;
    ctx.shadowColor = color; ctx.shadowBlur = 12;
    ctx.fillRect(-9, -9, 18, 18);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000';
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.rotate(-p.phase * 0.4);
    ctx.fillText(label, 0, 1);
    ctx.restore();
  }

  // ============ Game Flow ============
  function startGame() {
    score = 0; lives = 3; wave = 1;
    player.x = W/2; player.y = H - 80;
    player.powerLevel = 1; player.rapid = 0; player.shield = 0;
    player.invuln = 60; player.boostFuel = 100;
    bullets = []; enemyBullets = []; particles = []; powerups = []; floatingText = [];
    getAudio();
    spawnWave(wave);
    overlay.classList.remove('show');
    gameState = STATE.PLAY;
    updateHUD();
  }

  function pauseGame() {
    gameState = STATE.PAUSE;
    showOverlay(`
      <div class="panel">
        <h2>일시정지</h2>
        <p class="hint">▶ P 키로 재개</p>
      </div>
    `);
  }
  function resumeGame() {
    overlay.classList.remove('show');
    overlay.innerHTML = '';
    gameState = STATE.PLAY;
  }
  function gameOver() {
    gameState = STATE.OVER;
    if (score > hiScore) {
      hiScore = score;
      localStorage.setItem('starDriftHi', hiScore);
      hiEl.textContent = hiScore;
    }
    showOverlay(`
      <div class="panel">
        <h1 style="color:#ff2bd6;text-shadow:0 0 10px #ff2bd6,0 0 20px #ff2bd6;">GAME OVER</h1>
        <h2>SCORE: ${score}</h2>
        <p>Wave 도달: ${wave}</p>
        <p>최고 점수: ${hiScore}</p>
        <p class="hint">▶ SPACE 키로 다시 시작</p>
      </div>
    `);
  }
  function nextWave() {
    wave++;
    gameState = STATE.WAVE;
    addFloatingText(W/2, H/2 - 40, `WAVE ${wave}`, '#ffe600');
    if (wave % 5 === 0) addFloatingText(W/2, H/2, 'BOSS APPROACHING', '#ff2bd6');
    setTimeout(() => {
      if (gameState === STATE.WAVE) {
        spawnWave(wave);
        gameState = STATE.PLAY;
        updateHUD();
      }
    }, 1800);
    sweep(400, 1000, 0.4, 'triangle', 0.06);
  }
  function showOverlay(html) {
    overlay.innerHTML = html;
    overlay.classList.add('show');
  }
  function updateHUD() {
    scoreEl.textContent = score;
    waveEl.textContent = wave;
    livesEl.textContent = '♥'.repeat(Math.max(0, lives));
  }

  // ============ Main Loop ============
  function loop() {
    if (gameState === STATE.PLAY) {
      updatePlayer();
      updateBullets();
      updateEnemies();
      updatePowerups();
      checkCollisions();

      if (enemies.length === 0 && bullets.length >= 0) {
        nextWave();
      }
    }
    updateStars();
    updateParticles();
    render();
    requestAnimationFrame(loop);
  }
  loop();

  // ============ Resize ============
  function resize() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
  }
  resize();
  addEventListener('resize', resize);
})();
</script>
</body>

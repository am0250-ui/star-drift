<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MINI ARCADE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/games.css" />
</head>
<body>
  <!-- CRT 스캔라인 오버레이 -->
  <div class="scanlines"></div>
  <div class="crt-flicker"></div>

  <!-- 메인 허브 화면 -->
  <main id="hub" class="screen active">
    <header class="hub-header">
      <h1 class="title-glow">MINI ARCADE</h1>
      <p class="subtitle">SELECT YOUR GAME</p>
    </header>

    <section class="game-grid" id="game-grid">
      <!-- 게임 카드는 main.js에서 동적으로 생성 -->
    </section>

    <footer class="hub-footer">
      <button id="sound-toggle" class="pixel-btn small">SOUND: ON</button>
      <span class="copyright">© 2026 RETRO ARCADE</span>
    </footer>
  </main>

  <!-- 게임 화면 (모든 게임이 공유) -->
  <main id="game-screen" class="screen">
    <header class="game-header">
      <button id="back-btn" class="pixel-btn">&larr; BACK</button>
      <h2 id="game-title">GAME</h2>
      <div class="score-area">
        <span class="label">SCORE</span>
        <span id="current-score" class="score-value">0</span>
        <span class="label">HI</span>
        <span id="high-score" class="hi-value">0</span>
      </div>
    </header>

    <section id="game-container" class="game-container">
      <!-- 각 게임이 여기에 내용을 채움 -->
    </section>
  </main>

  <!-- 게임 오버 모달 -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title">GAME OVER</h2>
      <p id="modal-message"></p>
      <div id="modal-newrecord" class="hidden new-record">NEW RECORD!</div>
      <div class="modal-buttons">
        <button id="modal-retry" class="pixel-btn primary">RETRY</button>
        <button id="modal-menu" class="pixel-btn">MAIN MENU</button>
      </div>
    </div>
  </div>

  <!-- 스크립트 로딩 -->
  <script src="js/storage.js"></script>
  <script src="js/games/snake.js"></script>
  <script src="js/games/breakout.js"></script>
  <script src="js/games/2048.js"></script>
  <script src="js/games/memory.js"></script>
  <script src="js/games/tictactoe.js"></script>
  <script src="js/games/reaction.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
